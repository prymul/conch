# Phase 5 -- the `exec` builtin: replacing the current process, and its
# redirection-only form. All POSIX baseline, so every case runs against
# both `bash` and `sh`.

[[case]]
name = "exec-with-a-command-replaces-the-shell-process-entirely"
description = "exec cmd replaces the shell's own process image with cmd -- nothing written after it in the script ever runs, since there is no shell process left to run it"
tags = ["builtins", "exec"]
oracles = ["bash", "sh"]
script = '''
exec echo replaced
echo unreached
'''

[[case]]
name = "exec-exit-status-becomes-the-scripts-own-exit-status"
description = "since exec replaces the process rather than spawning a child, the exec'd command's own exit status is exactly what the whole invocation exits with"
tags = ["builtins", "exec", "exit-status"]
oracles = ["bash", "sh"]
script = '''
exec sh -c "exit 5"
'''

[[case]]
name = "exec-nonexistent-command-is-a-failure-not-a-crash"
description = "exec on a command that doesn't exist fails cleanly (exit 127) rather than somehow terminating differently -- the shell process is still intact at the moment exec fails, since nothing has been replaced yet. exec itself is one of POSIX's special built-ins, so this failure aborts the rest of the script on both shells (the trailing echo never actually runs; only the overall exit code -- 127 -- demonstrates the \"fails cleanly\" half). This also checks stderr: both shells fully suppress exec's own command-not-found diagnostic when it's redirected on the very same command, the same wording-independent guarantee eval-syntax-error-is-non-fatal-on-bash checks (see that case's own note)"
tags = ["builtins", "exec", "error-handling"]
oracles = ["bash", "sh"]
compare = ["stdout", "stderr", "exit-code"]
script = '''
exec nonexistent-cmd-xyz 2>/dev/null
echo "exit:$?"
'''

[[case]]
name = "exec-with-only-redirections-and-no-command-changes-the-shells-own-file-descriptors"
description = "exec with redirections but no command name doesn't replace anything -- it just applies those redirections to the current shell persistently, affecting every subsequent command until reversed. Restoring the original stdout via a saved file descriptor (fd 3) afterward proves the file actually captured the intervening output"
tags = ["builtins", "exec", "redirection"]
oracles = ["bash", "sh"]
script = '''
exec 3>&1 1>out.txt
echo one
echo two
exec 1>&3 3>&-
cat out.txt
'''
