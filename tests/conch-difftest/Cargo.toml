[package]
name = "conch-difftest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential test harness: runs the same script through conch and a real oracle shell (bash/sh) and diffs the result"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"

# Deliberately no dependency on `conch-shell` (the binary's package):
# it's bin-only (no `[lib]` target), which Cargo can't link against, so a
# normal path dependency here is silently dropped rather than making
# Cargo set `CARGO_BIN_EXE_conch` -- confirmed while building this crate.
# Cargo's artifact-dependencies (`bindeps`) feature is the real fix for
# this shape of problem but is still nightly-only (`-Z bindeps`, also
# confirmed against the toolchain this repo pins). `invoke::find_conch_binary`
# instead locates `target/{release,debug}/conch` relative to the
# workspace root directly -- see its doc comment and README.md ("Wiring
# in real execution").

[dev-dependencies]
# Phase 6's `PS1`/`PS2` expansion and command-position tab completion are
# the first (and, by design, only) pieces of conch's behavior this crate
# calls *in-process* rather than by spawning the compiled `conch` binary --
# see README.md's "Phase 6: what's differential and what isn't" for the
# full "why" (prompt rendering/completion only happen inside conch's
# interactive readline loop, which needs a real pty this harness never
# allocates). `conch-shell-core` is a genuine `[lib]` target (unlike the
# bin-only `conch-shell` package noted above), reachable as a normal path
# dependency with no `bindeps` workaround -- and, per the same README
# section, this only works *because* `expand_prompt`/`CompletionState`/
# `command_candidates` were deliberately placed there rather than staying
# in the bin-only `conch-shell` package they were first prototyped in.
# A `[dev-dependencies]` entry, not `[dependencies]`: nothing in this
# crate's own library code (`src/`) needs it, only
# `tests/phase6_prompt_differential.rs`/`tests/phase6_completion_differential.rs`.
conch-shell-core = { workspace = true }
