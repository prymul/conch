name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --no-banner --redact

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --from-latest-tag

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # Runs the conch-vs-bash/sh differential test suite (tests/conch-difftest)
  # as its own labeled job so its pass/fail/skip counts are trackable
  # independently of the general `test` job. `cargo test --all-features`
  # above already exercises this crate too (it's a normal workspace
  # member), but this job's `--nocapture` surfaces the harness's own
  # categorized report (see runner::print_report) in CI logs.
  #
  # CONCH_DIFFTEST_STRICT=1 makes a failing corpus case fail the build.
  # Phase 1 execution has landed and the corpus is 100/100 against real
  # bash/sh, so this is now a hard gate rather than report-only.
  #
  # CONCH_DIFFTEST_STRICT_PHASE6=1: unlike Phase 2-5 (still report-only --
  # their own conch-side execution is incomplete), Phase 6's two
  # in-process differential suites (`phase6_prompt_differential.rs`,
  # `phase6_completion_differential.rs` -- see tests/conch-difftest/README.md's
  # "Phase 6" section for why those call `conch_shell_core::expand_prompt`/
  # `command_candidates` directly rather than spawning a `conch` binary)
  # are fully green against the real, complete implementation as of this
  # writing, the same "green against a complete implementation, not a
  # partial one" bar Phase 1's own hard gate was flipped on.
  difftest:
    runs-on: ubuntu-latest
    env:
      CONCH_DIFFTEST_STRICT: "1"
      CONCH_DIFFTEST_STRICT_PHASE6: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify oracle shells are available
        run: |
          bash --version | head -1
          sh -c 'echo sh ok'
      - run: cargo build --release
      - run: cargo test -p conch-difftest --all-features -- --nocapture
